[package]
name = "syntaks"
version = "0.1.0"
edition = "2024"

[features]
pext = []
datagen = ["dep:ctrlc", "dep:rand"]
tune = ["dep:inventory"]
default = []

[dependencies]
arrayvec = "0.7.6"
atomic-wait = { git = "https://github.com/Sp00ph/atomic-wait", rev = "6c6db05" }
ctrlc = { version = "3.5.1", optional = true }
inventory = { version = "0.3.25", optional = true }
rand = { version = "0.9.2", optional = true }
